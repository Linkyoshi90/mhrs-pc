# Controls for the MOH: Rising Sun runner. Copy to controls.ini in the folder you start the game from
# (or point PS2X_CONTROLS at it). Lines you leave out keep the built-in bindings shown here.
# In the game window, F2 opens a menu that rebinds the controls and writes this file for you
# (F5 opens the cheat menu for the game's 12 bonus cheats, saved to cheats.ini).
#
# <target> = <input>, <input>, ...      (an empty value unbinds the target)
# inputs: key names (W, SPACE, LEFT_SHIFT, F1, KP_0, UP ...), mouse:left|right|middle|side|extra,
#         pad:a b x y lb rb lt rt back start ls rs dpad_up dpad_down dpad_left dpad_right,
#         pad:lx+ lx- ly+ ly- rx+ rx- ry+ ry-   (stick directions; + is right/down)

# Left stick (move) and right stick (look)
move_up    = W, pad:ly-
move_down  = S, pad:ly+
move_left  = A, pad:lx-
move_right = D, pad:lx+
look_up    = UP, pad:ry-
look_down  = DOWN, pad:ry+
look_left  = LEFT, pad:rx-
look_right = RIGHT, pad:rx+

# D-pad
up    = I, pad:dpad_up
down  = K, pad:dpad_down
left  = J, pad:dpad_left
right = L, pad:dpad_right

# Buttons
cross    = X, SPACE, pad:a
circle   = C, ESCAPE, pad:b
square   = Z, KP_0, pad:x
triangle = V, KP_1, pad:y
l1 = Q, mouse:right, pad:lb
r1 = E, mouse:left, pad:rb
l2 = LEFT_SHIFT, pad:lt
r2 = RIGHT_SHIFT, pad:rt
l3 = pad:ls
r3 = pad:rs
start  = ENTER, pad:start
select = TAB, pad:back

# Not a pad button: ends the movie that is playing (ignored during its first 2 seconds)
skip_movie = ESCAPE, BACKSPACE

# Not a pad button: while held the game runs several times faster and 3D drawing is skipped
# (to get through in-engine cutscenes)
fast_forward = F

# Settings
mouse_look  = 0     # mouse aim (try 8); 0 = off. In normal play the mouse turns the view directly (8 = ~0.046 degrees
                    # per pixel); where the game's look code is off (turrets) it moves the right stick instead.
deadzone    = 0     # gamepad stick dead zone, 0..0.9
sensitivity = 1     # scale of the gamepad look stick
invert_y    = 0     # 1 = invert look up/down (stick, keys and mouse)
gamepad     = 0     # which gamepad to use (0 = first); -1 = none (keyboard and mouse only)

# Player 2 (pad port 2, for the game's split-screen modes): the same names with a "p2_" prefix.
# By default player 2 has the gamepad bindings above on the second gamepad and no keys. Port 2 has a
# controller while player 2's gamepad is plugged in or player 2 has a key/mouse binding; otherwise it is
# empty, as for one player. skip_movie, fast_forward and mouse_look are player 1's only.
# Example: player 1 on keyboard + mouse, player 2 on the only gamepad: gamepad = -1 and p2_gamepad = 0.
#p2_cross       = pad:a
#p2_move_up     = pad:ly-
#p2_deadzone    = 0
#p2_sensitivity = 1
#p2_invert_y    = 0
#p2_gamepad     = 1
