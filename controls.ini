# Written by the controls menu (F2). Format: see controls.example.ini.
mouse_look = 8
deadzone = 0
sensitivity = 1
invert_y = 0
gamepad = 0
up = I, pad:dpad_up
down = K, pad:dpad_down
left = J, pad:dpad_left
right = L, pad:dpad_right
cross = X, SPACE, pad:a
circle = C, ESCAPE, pad:b
square = Z, KP_0, pad:x
triangle = V, KP_1, pad:y
l1 = pad:lb, Q
r1 = pad:rb, F
l2 = LEFT_SHIFT, pad:lt
r2 = pad:rt, E
l3 = pad:ls, 3
r3 = pad:rs, 4
start = ENTER, pad:start
select = TAB, pad:back
move_up = W, pad:ly-
move_down = S, pad:ly+
move_left = A, pad:lx-
move_right = D, pad:lx+
look_up = UP, pad:ry-
look_down = DOWN, pad:ry+
look_left = LEFT, pad:rx-
look_right = RIGHT, pad:rx+
skip_movie = ESCAPE, BACKSPACE
fast_forward = F
