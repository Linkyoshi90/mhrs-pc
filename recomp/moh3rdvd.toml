# PS2Recomp configuration for: MOH3RDVD.ELF
# Generated by ps2_analyzer (SDK names from its embedded SCE DB); function map from splat via tools/funcs_csv.py

[general]
# Path to input ELF file
input = "extracted/MOHRS/MOH3RDVD.ELF"

# Path to Ghidra exported function map (optional CSV)
ghidra_output = "build/functions.csv"

# Path to output directory
output = "build/recomp/"

# Single file output mode (recommended for large games)
