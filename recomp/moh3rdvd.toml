# The runtime's HLE stubs allocate scratch guest memory (GS/SIF packets) from the range SetupHeap
# reports, while the game runs its own allocator from _end (0x512E5C) to 0x1FC0000. Both started at
# _end, so the first runtime GS packet overwrote the game's heap header. Split them:
#   runtime scratch heap: 0x512E5C .. 0x522E5C (64 KB, via SetupHeap size)
#   game heap:            0x522E5C .. 0x1FC0000 (64 KB smaller than on hardware)
[patches]
instructions = [
  { address = "0x00135604", value = "0x3C050001" }, # _start SetupHeap: lui   $a1, 0x1    (was lui $a1, 0x0)
  { address = "0x0013560C", value = "0x24A50000" }, # _start SetupHeap: addiu $a1, $a1, 0 (was -1 = rest of RAM)
  { address = "0x002BDB90", value = "0x3C110052" }, # main heap base:   lui   $s1, 0x52   (was 0x51)
]
